{% extends "base.html" %}{% block content %}
<div class="page-title">Add S3 Connection</div>
<div class="page-subtitle">Configure a new S3 endpoint to browse.</div>

<div class="bucket-card" style="max-width: 600px; margin: 0 auto; display: block; padding: 32px; flex-direction: column;">
    <form method="POST" action="{{ url_for('new_connection') }}">
        <div style="margin-bottom: 24px;">
            <label for="name" class="form-label">Connection Name *</label>
            <input type="text" id="name" name="name" class="input-field" required placeholder="e.g., BPS Object Storage">
        </div>
        
        <div style="margin-bottom: 24px;">
            <label for="endpoint_url" class="form-label">Endpoint URL</label>
            <input type="url" id="endpoint_url" name="endpoint_url" class="input-field" placeholder="e.g., https://obj.bps.go.id">
        </div>

        <div style="margin-bottom: 24px;">
            <label for="access_key_id" class="form-label">AWS Access Key ID</label>
            <input type="text" id="access_key_id" name="access_key_id" class="input-field">
        </div>

        <div style="margin-bottom: 24px;">
            <label for="secret_access_key" class="form-label">AWS Secret Access Key</label>
            <input type="password" id="secret_access_key" name="secret_access_key" class="input-field">
        </div>

        <div style="margin-bottom: 24px;">
            <label for="region" class="form-label">Region</label>
            <input type="text" id="region" name="region" class="input-field" value="eu-central-1">
        </div>

        <div style="margin-bottom: 32px;">
            <label for="default_bucket" class="form-label">Default Bucket (Optional)</label>
            <input type="text" id="default_bucket" name="default_bucket" class="input-field" placeholder="e.g., sisnas-dms-mssd">
            <small style="color: var(--md-sys-color-on-surface-variant); display: block; margin-top: 8px;">If your user doesn't have permissions to list all buckets, you must specify a default bucket to connect to.</small>
        </div>

        <div style="display: flex; gap: 16px;">
            <button type="submit" class="btn btn-primary">Save Connection</button>
            <a href="{{ url_for('index') }}" class="btn btn-ghost">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
