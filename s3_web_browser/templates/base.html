<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S3 Browser</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    (function(){
      var theme = localStorage.getItem('theme');
      if(theme) document.documentElement.setAttribute('data-theme', theme);
      else if(window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme', 'dark');
    })();
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
    
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* M3 Light Theme */
      --md-sys-color-primary: #0061a4;
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-primary-container: #d1e4ff;
      --md-sys-color-on-primary-container: #001d36;
      --md-sys-color-secondary: #535f70;
      --md-sys-color-on-secondary: #ffffff;
      --md-sys-color-secondary-container: #d7e3f7;
      --md-sys-color-on-secondary-container: #101c2b;
      --md-sys-color-error: #ba1a1a;
      --md-sys-color-error-container: #ffdad6;
      --md-sys-color-on-error-container: #410002;
      --md-sys-color-background: #fdfcff;
      --md-sys-color-on-background: #1a1c1e;
      --md-sys-color-surface: #fdfcff;
      --md-sys-color-on-surface: #1a1c1e;
      --md-sys-color-surface-variant: #dfe2eb;
      --md-sys-color-on-surface-variant: #43474e;
      --md-sys-color-surface-container-lowest: #ffffff;
      --md-sys-color-surface-container-low: #f7f6fa;
      --md-sys-color-surface-container: #f1f0f4;
      --md-sys-color-surface-container-high: #ebeaef;
      --md-sys-color-surface-container-highest: #e6e4e9;
      --md-sys-color-outline: #73777f;
      --md-sys-color-outline-variant: #c3c7cf;

      /* Non-M3 aliases for compatibility */
      --bg: var(--md-sys-color-background);
      --surface: var(--md-sys-color-surface);
      --border: var(--md-sys-color-outline-variant);
      --accent: var(--md-sys-color-primary);
      --accent-h: #00528c;
      --text: var(--md-sys-color-on-surface);
      --text-muted: var(--md-sys-color-on-surface-variant);
      --text-xmut: var(--md-sys-color-outline);
      --folder: #f59e0b; /* keeping folder distinct */
      --danger: var(--md-sys-color-error);
      
      /* M3 Shapes */
      --md-sys-shape-corner-extra-small: 4px;
      --md-sys-shape-corner-small: 8px;
      --md-sys-shape-corner-medium: 16px;
      --md-sys-shape-corner-large: 24px;
      --md-sys-shape-corner-full: 9999px;
      
      /* M3 Elevations (Opacity simplified) */
      --md-sys-elevation-1: 0px 1px 2px 0px rgba(0, 0, 0, 0.3), 0px 1px 3px 1px rgba(0, 0, 0, 0.15);
      --md-sys-elevation-2: 0px 1px 2px 0px rgba(0, 0, 0, 0.3), 0px 2px 6px 2px rgba(0, 0, 0, 0.15);
      --md-sys-elevation-3: 0px 1px 3px 0px rgba(0, 0, 0, 0.3), 0px 4px 8px 3px rgba(0, 0, 0, 0.15);
      
      --radius: var(--md-sys-shape-corner-medium);
      --shadow: var(--md-sys-elevation-1);
    }
    
    :root[data-theme="dark"] {
      --md-sys-color-primary: #9ecaff;
        --md-sys-color-on-primary: #003258;
        --md-sys-color-primary-container: #00497d;
        --md-sys-color-on-primary-container: #d1e4ff;
        --md-sys-color-secondary: #bbc7db;
        --md-sys-color-on-secondary: #253140;
        --md-sys-color-secondary-container: #3b4858;
        --md-sys-color-on-secondary-container: #d7e3f7;
        --md-sys-color-error: #ffb4ab;
        --md-sys-color-error-container: #93000a;
        --md-sys-color-on-error-container: #ffdad6;
        --md-sys-color-background: #1a1c1e;
        --md-sys-color-on-background: #e2e2e6;
        --md-sys-color-surface: #1a1c1e;
        --md-sys-color-on-surface: #e2e2e6;
        --md-sys-color-surface-variant: #43474e;
        --md-sys-color-on-surface-variant: #c3c7cf;
        --md-sys-color-surface-container-lowest: #0f1013;
        --md-sys-color-surface-container-low: #1a1c1e;
        --md-sys-color-surface-container: #1e2022;
        --md-sys-color-surface-container-high: #282a2d;
        --md-sys-color-surface-container-highest: #333538;
        --md-sys-color-outline: #8d9199;
        --md-sys-color-outline-variant: #43474e;
        
        --accent-h: #8cb9f5;
        --border: var(--md-sys-color-outline-variant);
    }

    body {
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: var(--md-sys-color-on-surface);
      background: var(--md-sys-color-background);
      min-height: 100vh;
      transition: background-color 0.3s, color 0.3s;
    }

    /* ── Header (M3 Top App Bar) ── */
    header {
      background: var(--md-sys-color-surface-container);
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: none; /* M3 flat top app bar */
    }
    header .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 500;
      font-size: 22px; /* M3 Title Large */
      color: var(--md-sys-color-on-surface);
      text-decoration: none;
    }
    header .logo svg { color: var(--md-sys-color-primary); flex-shrink: 0; }

    /* ── Layout ── */
    .page { max-width: 1024px; margin: 0 auto; padding: 24px 24px 48px; }

    /* ── Breadcrumb ── */
    .breadcrumb {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
      font-size: 14px;
      color: var(--md-sys-color-on-surface-variant);
      margin-bottom: 24px;
    }
    .breadcrumb a { 
      color: var(--md-sys-color-primary); 
      text-decoration: none; 
      padding: 4px 8px; 
      border-radius: var(--md-sys-shape-corner-small); 
    }
    .breadcrumb a:hover { background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); }
    .breadcrumb .sep { color: var(--md-sys-color-outline); padding: 0 4px; }
    .breadcrumb .current { color: var(--md-sys-color-on-surface); font-weight: 500; padding: 4px 8px; }

    /* ── Forms & Search (M3 Outlined Field) ── */
    .search-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }
    .input-field, .search-bar input {
      flex: 1;
      height: 56px;
      padding: 0 16px;
      border: 1px solid var(--md-sys-color-outline);
      border-radius: var(--md-sys-shape-corner-extra-small);
      font-size: 16px;
      color: var(--md-sys-color-on-surface);
      background: transparent;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
      width: 100%;
    }
    .input-field:focus, .search-bar input:focus {
      border: 2px solid var(--md-sys-color-primary);
      padding: 0 15px; /* offset 2px border */
    }
    .input-field::placeholder, .search-bar input::placeholder { color: var(--md-sys-color-on-surface-variant); }
    
    .form-label {
      display: block;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--md-sys-color-on-surface);
      font-size: 14px;
    }
    
    /* ── Buttons (M3 Filled, Tonal, Text) ── */
    .btn {
      height: 40px;
      padding: 0 24px;
      border: none;
      border-radius: var(--md-sys-shape-corner-full);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      transition: background 0.2s, color 0.2s, box-shadow 0.2s;
      white-space: nowrap;
      position: relative;
      overflow: hidden;
    }
    /* Simple ripple effect setup */
    .btn::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: currentColor;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .btn:hover::after { opacity: 0.08; }
    .btn:active::after { opacity: 0.12; }

    .btn-primary { 
      background: var(--md-sys-color-primary); 
      color: var(--md-sys-color-on-primary); 
    }
    .btn-primary:hover { box-shadow: var(--md-sys-elevation-1); }
    
    .btn-ghost {
      background: transparent;
      color: var(--md-sys-color-primary);
      padding: 0 16px;
    }
    .btn-ghost:hover { background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); }

    /* ── Hint text ── */
    .hint { font-size: 12px; color: var(--md-sys-color-on-surface-variant); margin-top: -14px; margin-bottom: 16px; }

    /* ── Actions bar ── */
    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .actions .spacer { flex: 1; }

    /* ── File table (M3 Surface Container) ── */
    .file-table {
      background: var(--md-sys-color-surface-container-low);
      border-radius: var(--md-sys-shape-corner-medium);
      overflow: hidden;
      box-shadow: none;
    }
    .file-table-header {
      display: grid;
      grid-template-columns: 1fr 90px 150px 140px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 500;
      color: var(--md-sys-color-on-surface-variant);
      background: var(--md-sys-color-surface-container);
    }
    .file-row {
      display: grid;
      grid-template-columns: 1fr 90px 150px 140px;
      padding: 12px 24px;
      border-bottom: 1px solid var(--md-sys-color-surface-variant);
      align-items: center;
      transition: background .2s;
    }
    .file-row:last-child { border-bottom: none; }
    .file-row:hover { background: var(--md-sys-color-surface-container-highest); }

    .file-name {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
    }
    .file-name svg { flex-shrink: 0; color: var(--md-sys-color-on-surface-variant); }
    .file-name.is-folder svg { color: var(--md-sys-color-primary); fill: var(--md-sys-color-primary); }
    .file-name a {
      color: var(--md-sys-color-on-surface);
      text-decoration: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 16px;
    }
    .file-name a:hover { color: var(--md-sys-color-primary); text-decoration: underline; }
    .file-name.is-folder a { font-weight: 500; }

    .file-size, .file-date { color: var(--md-sys-color-on-surface-variant); font-size: 14px; font-variant-numeric: tabular-nums; }
    .file-action { display: flex; justify-content: flex-end; gap: 4px; }
    
    .dl-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      color: var(--md-sys-color-on-surface-variant);
      transition: background 0.2s, color 0.2s;
      position: relative;
    }
    .dl-btn::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: 50%;
      background: currentColor;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .dl-btn:hover::after { opacity: 0.08; }
    .dl-btn:hover { color: var(--md-sys-color-primary); }
    button.dl-btn { background: none; border: none; cursor: pointer; font: inherit; }
    
    .delete-btn:hover { color: var(--md-sys-color-error); }
    .copy-btn.copied { color: #16a34a; }

    /* ── Empty state ── */
    .empty {
      padding: 64px 24px;
      text-align: center;
      color: var(--md-sys-color-on-surface-variant);
      background: var(--md-sys-color-surface-container-low);
      border-radius: var(--md-sys-shape-corner-medium);
    }
    .empty svg { margin-bottom: 16px; color: var(--md-sys-color-outline); width: 48px; height: 48px; }
    .empty p { font-size: 16px; }

    /* ── Pagination ── */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 32px;
      flex-wrap: wrap;
    }
    .pagination a, .pagination .pg-current, .pagination .pg-gap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 40px;
      height: 40px;
      padding: 0 8px;
      border-radius: var(--md-sys-shape-corner-full);
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      transition: background .2s, color .2s;
    }
    .pagination a { color: var(--md-sys-color-on-surface-variant); }
    .pagination a:hover { background: var(--md-sys-color-surface-container-highest); color: var(--md-sys-color-on-surface); }
    .pagination .pg-current {
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
      pointer-events: none;
    }
    .pagination .pg-gap { color: var(--md-sys-color-outline); pointer-events: none; }
    .pagination .pg-arrow { font-size: 20px; }

    /* ── Bucket grid (M3 Cards) ── */
    .bucket-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }
    .bucket-card {
      background: var(--md-sys-color-surface-container);
      border-radius: var(--md-sys-shape-corner-medium);
      padding: 24px;
      text-decoration: none;
      color: var(--md-sys-color-on-surface);
      display: flex;
      align-items: center;
      gap: 16px;
      transition: box-shadow 0.2s, background 0.2s;
      position: relative;
    }
    .bucket-card::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: var(--md-sys-color-primary);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .bucket-card:hover {
      box-shadow: var(--md-sys-elevation-1);
    }
    .bucket-card:hover::after { opacity: 0.04; }
    
    .bucket-card svg { 
      color: var(--md-sys-color-primary); 
      fill: var(--md-sys-color-primary-container); 
      flex-shrink: 0; 
      width: 24px; height: 24px; 
    }
    .bucket-card span {
      font-size: 16px;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Page title ── */
    .page-title {
      font-size: 24px; /* M3 Headline Small */
      font-weight: 400;
      color: var(--md-sys-color-on-surface);
      margin-bottom: 8px;
    }
    .page-subtitle {
      font-size: 14px;
      color: var(--md-sys-color-on-surface-variant);
      margin-bottom: 24px;
    }

    /* ── Error ── */
    .error-card {
      background: var(--md-sys-color-error-container);
      color: var(--md-sys-color-on-error-container);
      border-radius: var(--md-sys-shape-corner-medium);
      padding: 48px 32px;
      text-align: center;
      max-width: 480px;
      margin: 64px auto;
    }
    .error-card svg { color: var(--md-sys-color-error); margin-bottom: 16px; width: 48px; height: 48px; }
    .error-card h2 { font-size: 20px; font-weight: 500; margin-bottom: 12px; }
    .error-card p { opacity: 0.9; font-size: 14px; margin-bottom: 24px; }
    .error-card .btn-primary { 
      background: var(--md-sys-color-error);
      color: var(--md-sys-color-error-container);
    }

    /* ── Count badge ── */
    .count-badge {
      font-size: 12px;
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
      padding: 2px 8px;
      border-radius: var(--md-sys-shape-corner-full);
      margin-left: 8px;
    }

    /* ── Progress bar ── */
    #nprogress {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 4px;
      z-index: 9999;
      pointer-events: none;
      transform: translateX(-100%);
      transition: transform .2s ease, opacity .3s ease;
      opacity: 0;
      background: var(--md-sys-color-primary);
    }
    #nprogress.running { opacity: 1; animation: progress-run 1.8s ease-in-out infinite; }
    #nprogress.done { transform: translateX(0); opacity: 0; transition: transform .15s ease, opacity .3s ease .1s; }
    @keyframes progress-run {
      0%   { transform: translateX(-100%); }
      50%  { transform: translateX(-15%); }
      100% { transform: translateX(-5%); }
    }

    /* ── Loading overlay ── */
    #loading-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--md-sys-color-surface-container);
      opacity: 0.8;
      z-index: 9998;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
    }
    #loading-overlay.visible { display: flex; }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid var(--md-sys-color-surface-variant);
      border-top-color: var(--md-sys-color-primary);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-msg {
      font-size: 14px;
      color: var(--md-sys-color-on-surface);
      font-weight: 500;
    }

    /* ── Button loading state ── */
    .btn.loading { opacity: .7; pointer-events: none; cursor: default; }
    .btn.loading .btn-spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin .6s linear infinite;
    }
    .btn.loading .btn-icon { display: none; }
  </style>
</head>
<body>
  <div id="nprogress"></div>
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-msg" id="loading-msg">Loading…</div>
  </div>

  <header>
    <a href="/" class="logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3"/>
      </svg>
      S3 Browser
    </a>
    <button id="theme-toggle" title="Toggle Light/Dark Theme" style="margin-left: auto; background: none; border: none; cursor: pointer; color: var(--md-sys-color-on-surface); padding: 8px; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
      <svg id="theme-icon-light" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
        <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
      <svg id="theme-icon-dark" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </header>
  <div class="page">
    {% block content %}{% endblock %}
  </div>

  <script>
    // Theme toggle logic
    const themeToggle = document.getElementById('theme-toggle');
    const iconLight = document.getElementById('theme-icon-light');
    const iconDark = document.getElementById('theme-icon-dark');
    function updateThemeIcon() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      iconLight.style.display = isDark ? 'block' : 'none';
      iconDark.style.display = isDark ? 'none' : 'block';
    }
    updateThemeIcon();
    themeToggle.addEventListener('click', () => {
      let currentTheme = document.documentElement.getAttribute('data-theme');
      let targetTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', targetTheme);
      localStorage.setItem('theme', targetTheme);
      updateThemeIcon();
    });

    const bar = document.getElementById('nprogress');
    const overlay = document.getElementById('loading-overlay');
    const loadingMsg = document.getElementById('loading-msg');
    const DELAY_MS = 150; // don't show for fast loads
    let timer = null;

    function showLoading(msg) {
      // Start the top progress bar immediately
      bar.className = 'running';
      // Show the overlay only if the response takes > DELAY_MS
      timer = setTimeout(() => {
        loadingMsg.textContent = msg || 'Loading…';
        overlay.classList.add('visible');
      }, DELAY_MS);
    }

    function hideLoading() {
      clearTimeout(timer);
      bar.className = 'done';
      overlay.classList.remove('visible');
      setTimeout(() => { bar.className = ''; }, 500);
    }

    // Intercept all same-origin link clicks (skip download links, anchors, external)
    document.addEventListener('click', e => {
      const a = e.target.closest('a[href]');
      if (!a) return;
      const href = a.getAttribute('href');
      if (!href || href.startsWith('#') || a.target === '_blank') return;
      try {
        const url = new URL(href, location.href);
        if (url.origin !== location.origin) return;
      } catch { return; }
      // Skip download route — browser handles that
      if (href.includes('/download/')) return;
      showLoading('Loading…');
    });

    // Intercept search form submit
    document.addEventListener('submit', e => {
      const form = e.target.closest('form');
      if (!form) return;
      const input = form.querySelector('input[name="search"]');
      const val = input ? input.value.trim() : '';
      const msg = val ? `Searching for "${val}"…` : 'Loading…';
      showLoading(msg);
      // Put the search button into loading state
      const btn = form.querySelector('button[type="submit"]');
      if (btn) {
        btn.classList.add('loading');
        const icon = btn.querySelector('svg');
        if (icon) icon.classList.add('btn-icon');
        const sp = document.createElement('span');
        sp.className = 'btn-spinner';
        btn.prepend(sp);
      }
    });

    // Hide as soon as the new page starts painting (pageshow covers back/forward too)
    window.addEventListener('pageshow', hideLoading);
    // Safety net — hide if somehow already loaded
    if (document.readyState === 'complete') hideLoading();
    else window.addEventListener('load', hideLoading);

    // Copy S3 path buttons
    document.addEventListener('click', e => {
      const btn = e.target.closest('.copy-btn');
      if (!btn) return;
      const path = btn.dataset.s3path;
      navigator.clipboard.writeText(path).then(() => {
        const iconCopy  = btn.querySelector('.icon-copy');
        const iconCheck = btn.querySelector('.icon-check');
        iconCopy.style.display  = 'none';
        iconCheck.style.display = '';
        btn.classList.add('copied');
        btn.title = 'Copied!';
        setTimeout(() => {
          iconCopy.style.display  = '';
          iconCheck.style.display = 'none';
          btn.classList.remove('copied');
          btn.title = 'Copy S3 path';
        }, 1500);
      });
    });
  </script>
</body>
</html>
